name: Build

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

defaults:
  run:
    shell: pwsh

permissions: read-all

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ["x86", "x64"]
    env:
      Configuration: Release
      Platform: ${{ matrix.platform }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.100"
      - name: Log in to package source
        shell: pwsh
        run: |
            dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Atlas-Rhythm/index.json"
      - name: Clear Nuget Cache
        run: dotnet nuget locals all --clear
      - name: Restore
        run: msbuild -t:Restore -m
      - name: Build
        run: msbuild -t:Build -m
      - name: Upload net472
        uses: actions/upload-artifact@v4
        with:
          name: BSIPA-net472-${{ env.Platform }}
          path: BSIPA-Meta/bin/${{ env.Platform }}/${{ env.Configuration }}/net472/

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Grab the build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: BSIPA-*
          path: artifacts

      - name: Zip everything up nicely
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($dir in Get-ChildItem artifacts -Directory) {
            # e.g. BSIPA-net472-x64 -> BSIPA-v4.3.0-net472-x64.zip
            $friendly = $dir.Name -replace '^BSIPA-', "BSIPA-$version-"
            Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath "release/$friendly.zip"
          }
          Get-ChildItem release

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BSIPA ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*.zip